[project]
name = "job-agent"
version = "2.0.0"
description = "Personal job / internship / fellowship agent: fetch, score, AI-screen, tailor, alert, encrypted dashboard."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["site", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PERF", "RUF", "S"]
ignore = [
  "E501",                      # long lines (config-like keyword lists)
  "E731", "E741",              # small lambdas / short names in parsing code
  "RUF001", "RUF002", "RUF003",  # emoji and typographic characters are intentional
  "RUF005", "SIM103", "SIM105",
  "S110", "S112",              # scrapers: one broken item must never stop a run (logged at source level)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "B017", "C408", "PLW1510"]
