# ============ EDIT THIS FILE TO MATCH YOU ============

# Your personal profile for the AI (who you are, what to emphasise) lives in cv/profile.txt,
# which is encrypted with your CV. Run `python -m agent.secure lock` after editing it.
profile: ""

# ---------------------------------------------------------------------------------------------
# YOUR CATEGORIES. Every listing goes in the category it matches best.
#   kinds:          job | internship | fellowship
#   work_modes:     remote | hybrid | onsite | unknown
#   tiers:          title words grouped by fit for you (Excellent / Very good / Good)
#   must_any:       (instead of tiers) at least one must appear (in the title if match_in: title)
#   locations_any:  the location must mention one of these (locations_in: all = title/description too)
#   require_tunisia: true = the posting must confirm it is open to people in Tunisia
#   require_any:    at least one must also appear anywhere in the posting
#   boost_any:      each one found raises the score
#   bonus:          points added to this category's score (wins ties against other categories)
#   remote_if_tunisia: true = remote jobs confirmed open to Tunisia also count, wherever the company is
#   student:        true = CVs/letters for this category say you're a student; false = they never mention your studies
# (lists written as *name reuse the word lists defined just below)
# ---------------------------------------------------------------------------------------------
focus_places: &focus [london, united kingdom, uk, england, italy, italia, milan, milano, rome, roma, turin, torino,
  bologna, florence, firenze, naples, napoli, padua, padova, pisa, trento, genoa, genova, verona, bergamo]

titles_ai_data: &ai [machine learning, ml, artificial intelligence, ai, data scientist, data science, data analyst,
  data analytics, analytics, business intelligence, bi analyst, data engineer, nlp, llm, generative ai, research analyst,
  quantitative analyst, ai engineer, deep learning, computer vision, insights analyst, reporting analyst]
titles_fintech: &fin [payments operations, payment operations, payments, payment, fraud, financial crime, fincrime, kyc,
  aml, anti-money laundering, risk analyst, risk operations, compliance analyst, compliance operations, transaction monitoring,
  chargeback, disputes, treasury operations, finance operations, banking operations, onboarding analyst, credit analyst]
titles_support: &sup [customer support, customer service, customer success, customer experience, customer care,
  technical support, product support, support specialist, support analyst, support associate, operations analyst,
  operations associate, operations specialist, service desk, help desk, client operations, implementation]

categories:
  # Research labs, AI/ML/DL internships, AI startups and AI-in-fintech: you are presented as a student
  - name: "🔬 AI research & startups"
    kinds: [internship, job]
    work_modes: [onsite, hybrid, remote, unknown]
    locations_any: *focus
    remote_if_tunisia: true
    student: true
    bonus: 15
    match_in: title
    tiers:
      Excellent: [research assistant, research intern, research internship, ai intern, ai internship, machine learning intern,
        ml intern, deep learning intern, data science intern, nlp intern, computer vision intern, applied scientist intern,
        student researcher, research engineer intern, junior ai research, ml research intern, junior research, graduate research,
        ai residency, ai resident, ai in fintech, machine learning internship]
      Very good: [junior machine learning, graduate machine learning, junior ml, junior ai engineer, junior data scientist,
        graduate data scientist, ai engineer intern, research software engineer, machine learning engineer intern,
        quantitative research intern, research analyst, data scientist intern, ai/ml intern, ml/ai intern]
      Good: [data scientist, machine learning engineer, ml engineer, ai engineer, research engineer, applied scientist,
        applied ai, ai developer, llm engineer, nlp engineer, computer vision engineer, deep learning engineer,
        ai software engineer, ml/nlp engineer, ai data scientist, ai research engineer, research scientist intern]
    require_any: [machine learning, deep learning, artificial intelligence, ai, neural, nlp, llm, computer vision,
      data science, reinforcement learning, generative, large language model, predictive]
    require_min: 2   # the AI/ML topic must be clearly stated (at least 2 different terms)
    exclude_title: [postdoc, postdoctoral, lecturer, professor, research fellow, research associate, studentship, reader,
      faculty, security, defence, defense, sales, recruiter, marketing, mts, member of technical staff, partner, architect,
      cfd, mechanical, civil, wind, structural, chemical, hydrodynamic, clinical trial]
    boost_any: [fintech, finance, financial, payments, fraud, risk, credit, startup, start-up, seed, series a, early-stage,
      founding, student, undergraduate, bachelor, summer, internship, visa sponsorship, sponsorship, ktp, python, pytorch,
      tensorflow, lstm, time series, predictive maintenance, forecasting]

  - name: "🇬🇧🇮🇹 London & Italy internship"
    kinds: [internship]
    work_modes: [onsite, hybrid, remote, unknown]
    locations_any: *focus
    match_in: title
    tiers:
      Excellent: [*ai, *fin]
      Very good: [*sup, fintech, finance, product, strategy, business analyst]
      Good: [operations, technology, software, engineering, it, research]
    student: true
    boost_any: [fintech, payments, ai, machine learning, data, python, sql, visa sponsorship, sponsorship, graduate,
      summer, paid, salary, stipend]

  - name: "🇬🇧🇮🇹 London & Italy job"
    kinds: [job]
    work_modes: [onsite, hybrid, remote, unknown]
    locations_any: *focus
    match_in: title
    tiers:
      Excellent: [*fin, junior data analyst, data analyst, graduate data, graduate analyst, junior data scientist,
        ai trainer, ai operations]
      Very good: [*sup, *ai]
      Good: [operations analyst, operations associate, business analyst, data, analyst, graduate scheme]
    student: false
    exclude_title: [sales, account executive, account manager, business development, recruiter, marketing,
      nurse, clinical, driver, warehouse, chef, architect, legal counsel, lawyer, solicitor, accountant, security,
      hygiene, retail, store, hospitality, construction, surveyor, teacher, care assistant, pharmac,
      actuarial, underwriter, cyber, network, devops, sre, embedded, hardware, defence, defense]
    boost_any: [junior, graduate, entry level, entry-level, associate, trainee, fintech, payments, french, arabic,
      english, visa sponsorship, sponsorship, python, sql, ai, machine learning]

  - name: "🎯 Remote job open to Tunisia"
    kinds: [job, internship]
    work_modes: [remote]
    require_tunisia: true
    student: false
    match_in: title
    tiers:
      Excellent: [technical support, saas support, product support, payment operations, payments operations,
        payment support, billing support, transaction operations, fintech customer support, fintech support,
        bilingual customer support, customer support consultant, customer support specialist, support specialist,
        service desk analyst, *fin, junior data analyst, data analyst]
      Very good: [customer success, technical customer success, quality assurance analyst, qa analyst, support quality,
        customer support, customer service, customer care, customer experience, *ai]
      Good: [implementation, onboarding specialist, client delivery operations, client operations, ai trainer,
        ai operations, operations associate, operations specialist, back office, technical operations]
    exclude_title: [sales, account executive, clinical, nurse, psycholog, counsellor, driver, warehouse, maximo,
      developer, engineer ii, architect, cad, cfd, mechanical, civil, chemical, electrical, simulation]
    boost_any: [fintech, payments, payment, paypal, banking, saas, api, french, bilingual, emea, tunisia, africa,
      usd, eur, part-time, part time, contract]

  - name: "🎓 UK & Italy scholarship / fellowship"
    kinds: [fellowship]
    work_modes: [remote, hybrid, onsite, unknown]
    match_in: all
    locations_any: [united kingdom, uk, london, england, britain, british, chevening, commonwealth, scotland,
      italy, italian, italia, milan, rome, turin, bologna, florence, padua, pisa, trento]
    locations_in: all
    student: true
    exclude_title: [top, how to, tips, ways to, mistakes, guide, currently open, list of, best, usa, u.s, united states,
      america, american, germany, german, humboldt, japan, canada, australia, china, korea, netherlands, switzerland,
      france, spain, sweden, denmark, finland, norway, belgium, austria, ireland, singapore, taiwan, hong kong, turkey,
      reagan-fascell, hurford, mcw, research associate, us citizens, marshall]
    must_any: [fellowship, fellows, scholarship, program, programme, residency, grant]
    require_any: [fully funded, funded, paid, stipend, allowance, honorarium, salary, scholarship,
      tuition, covered, compensation]
    boost_any: [united kingdom, uk, london, italy, ai, artificial intelligence, machine learning, data, technology,
      tech, digital, stem, engineering, computer science, fintech, innovation, women, young, africa, tunisia]

