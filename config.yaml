# Extra ATS keywords specific to your field (added to the built-in skills list).
extra_keywords: [ros, predictive maintenance, lstm, prompt engineering, webrtc, mern, kpi, mentoring,
  customer support, customer service, technical support, client operations, disputes, kyc, aml,
  zendesk, salesforce, crm, ticketing, sla, troubleshooting, escalation, french, arabic, english,
  financial crime, transaction monitoring, payments, rag, fastapi, time series, forecasting, scikit-learn]

filters:
  max_age_days: 30
  max_experience_years: 2          # skip jobs asking for 3+ years (you have ~1 year)
  hide_not_open_to_tunisia: false  # on-site roles are judged by place; remote roles use tunisia_ok / remote_ok
  # Languages you don't speak: postings that require them (or are written in them) are skipped
  exclude_required_languages: [Italian, German, Spanish, Dutch, Portuguese, Polish, Swedish, Danish, Norwegian,
    Japanese, Greek, Bulgarian, Romanian, Czech, Turkish, Hebrew, Russian, Finnish, Hungarian, Korean, Chinese,
    Croatian, Serbian, Slovak, Slovenian, Ukrainian, Lithuanian, Latvian, Estonian, Flemish, Swiss German, Hindi, Thai,
    Vietnamese, Indonesian, Malay]
  exclude_title_words: [senior, sr, staff, principal, lead, leader, director, head, manager, vp, phd, mba, expert, ii, iii,
    iv, mid-level, mid level, experienced, mts, member of technical staff, research associate, postdoc, postdoctoral,
    emirati, emiratis, saudi national, saudi nationals, qatari, kuwaiti, omani national, bahraini, nationals only,
    accounting, accountant, audit, us remote, us only, usa only, u.s. only, us-based, canada only]
  exclude_words: [us citizens only, security clearance, must be located in the us, must reside in the us,
    must reside in the united states, located in the united states, us work authorization, authorized to work in the us]
  allowed_locations: []            # location is decided per category now

min_score: 40                 # 0-100; raise to get fewer, better alerts
max_alerts_per_run: 15
max_ai_tailoring_per_run: 6   # new matches that get a full apply kit each run (free AI quota)
max_backfill_kits_per_run: 6  # older good matches that still have no kit
notify_when_empty: false

sources: [curated, workable, company_boards, jobs_ac_uk, wp_search, adzuna, devpost, gdg_events, remotive, remoteok, jobicy,
  himalayas]

