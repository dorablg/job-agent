# which is encrypted with your CV. Run `python -m agent.secure lock` after editing it.
profile: ""

# ---------------------------------------------------------------------------------------------
# YOUR CATEGORIES. Every listing goes in the category it matches best.
#   kinds:          job | internship | fellowship
#   work_modes:     remote | hybrid | onsite | unknown
#   tiers:          title words grouped by fit for you (Excellent / Very good / Good)
#   must_any:       (instead of tiers) at least one must appear (in the title if match_in: title)
#   locations_any:  the location must mention one of these (locations_in: all = title/description too)
#   remote_ok:      remote jobs also count if their Tunisia eligibility is in this list (yes / check)
#   tunisia_ok:     the posting's Tunisia eligibility must be in this list (for remote-only categories)
#   require_any:    at least require_min of these must appear in the title or start of the posting
#   boost_any:      each one found raises the score
#   bonus:          points added to this category's score (decides which category wins)
#   student:        true = CVs/letters say you're a student; false = they never mention your studies
#   requires:       several conditions, each {any: [...], min: N} (e.g. fully funded AND about tech/AI)
#   employment:     only these contract types (part-time includes freelance / contract hours)
#                   (internships always say you're a student)
# (lists written as *name reuse the word lists defined just below)
# ---------------------------------------------------------------------------------------------
