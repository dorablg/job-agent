# ============ EDIT THIS FILE TO MATCH YOU ============

# Your personal profile for the AI (who you are, what to emphasise) lives in cv/profile.txt,
# which is encrypted with your CV. Run `python -m agent.secure lock` after editing it.
profile: ""

# ---------------------------------------------------------------------------------------------
# YOUR CATEGORIES. Every alert is put in the category it matches best.
#   kinds:       job | internship | fellowship
#   work_modes:  remote | hybrid | onsite
#   must_any:    at least one of these must appear (in the title if match_in: title)
#   require_any: at least one of these must ALSO appear anywhere in the posting (optional)
#   boost_any:   each one found raises the score (your favourite topics)
#   tiers:       title groups by fit (Excellent / Very good / Good) instead of must_any
# ---------------------------------------------------------------------------------------------
categories:
  - name: "🤖 AI internship"
    kinds: [internship]
    work_modes: [remote, hybrid, unknown]   # "unknown" = opportunity sites that don't say
    match_in: title
    must_any: [ai, artificial intelligence, machine learning, ml, deep learning, data science, llm,
      generative ai, nlp, computer vision, data scientist, ai engineer, data, analytics, research,
      python, mlops]
    boost_any: [fintech, finance, payments, banking, fraud, risk, insurance, environment, environmental,
      climate, sustainability, sustainable, energy, renewable, green, agriculture, carbon, earth]

  # Your strategy: remote from Tunisia, paid in USD/EUR, Associate / Specialist / Junior level.
  # Titles are grouped by how well they fit you; the fit is shown on every listing and boosts its score.
  - name: "🎯 Target remote job"
    kinds: [job, internship]
    work_modes: [remote]
    match_in: title
    tiers:
      Excellent: [technical support specialist, technical support, tech support, saas support, saas customer support,
        product support, payment operations, payments operations, payment support, payments support, billing support,
        transaction operations, fintech customer support, fintech support, bilingual customer support,
        customer support consultant, customer support specialist, customer support agent, customer support associate,
        customer support representative, customer service representative, customer care, support specialist,
        support consultant, service desk analyst, help desk]
      Very good: [customer success associate, customer success specialist, customer success, technical customer success,
        fraud operations, fraud analyst, fraud specialist, risk operations, trust and safety, chargeback, disputes,
        dispute, kyc analyst, kyc specialist, aml analyst, quality assurance analyst, qa analyst, quality analyst,
        support quality, customer experience specialist, customer experience associate]
      Good: [implementation support, implementation specialist, implementation associate, onboarding specialist,
        client delivery operations, client operations, junior data analyst, data analyst, ai operations, ai trainer,
        operations associate, operations specialist, back office, backoffice, technical operations]
    exclude_title: [sales, account executive, clinical, nurse, psycholog, counsellor, driver, warehouse, maximo,
      developer, engineer ii, architect, cad, cfd, mechanical, civil, chemical, electrical, simulation, sydney,
      tx, tn, ca, ny, fl]
    boost_any: [fintech, payments, payment, paypal, banking, saas, api, french, bilingual, english c1, emea,
      tunisia, africa, usd, eur, part-time, part time, contract, zendesk, intercom, freshdesk, salesforce]

  - name: "🌍 Paid fellowship"
    kinds: [fellowship]
    work_modes: [remote, hybrid, onsite, unknown]
    match_in: all
    exclude_title: [top, how to, tips, ways to, mistakes, guide, currently open, list of, best]
    must_any: [fellowship, fellows, scholarship, program, programme, residency, grant]
    require_any: [fully funded, funded, paid, stipend, allowance, honorarium, salary, scholarship,
      tuition, covered, compensation]
    boost_any: [ai, artificial intelligence, machine learning, data, technology, tech, digital, stem,
      engineering, computer science, climate, environment, sustainability, fintech, innovation, research,
      women, young, africa, mena, tunisia, international, remote, virtual, online]

# Used to query search-capable sources (Jobicy tags, Himalayas search).
search_terms: [technical support, customer support, payments operations, product support, customer success,
  fraud operations, machine learning, intern]

# Workable job search limited to jobs open in Tunisia (remote). One search per line.
workable_queries: [technical support, customer support, saas support, payment operations, payments,
  billing support, product support, customer success, fraud, trust and safety, quality assurance,
  implementation, onboarding, data analyst, ai operations, operations, back office, bilingual, french]

# Extra ATS keywords specific to your field (added to the built-in skills list).
extra_keywords: [ros, predictive maintenance, lstm, prompt engineering, webrtc, mern, kpi, mentoring,
  customer support, customer service, technical support, client operations, disputes, kyc, aml,
  zendesk, salesforce, crm, ticketing, sla, troubleshooting, escalation, french, arabic, english]

filters:
  max_age_days: 21
  max_experience_years: 3      # skip jobs asking for 4+ years
  hide_not_open_to_tunisia: true
  exclude_title_words: [senior, sr, staff, principal, lead, director, head, manager, vp, phd, us remote,
    us only, usa only, u.s. only, us-based, canada only]
  exclude_words: [us citizens only, security clearance, must be located in the us, must reside in the us,
    must reside in the united states, located in the united states, us work authorization, authorized to work in the us]
  # If a posting names a location, it must contain one of these (empty list = anywhere).
  allowed_locations: [worldwide, anywhere, global, emea, africa, tunisia, middle east, mena, north africa, europe, france]

min_score: 35                 # 0-100; raise to get fewer, better alerts
max_alerts_per_run: 10
max_ai_tailoring_per_run: 8   # new matches that get a full apply kit each run (free AI quota)
max_backfill_kits_per_run: 4  # older good matches that still have no kit
notify_when_empty: false

sources: [workable, remotive, remoteok, jobicy, himalayas]

# Fellowships / scholarships / internships RSS feeds (add any WordPress site's /feed/).
rss_feeds:
  - https://opportunitydesk.org/feed/
  - https://opportunitydesk.org/category/internships/feed/
  - https://opportunitydesk.org/category/fellowships/feed/
  - https://opportunitiescorners.com/feed/
  - https://opportunitiescorners.com/category/internships/feed/
  - https://www.opportunitiesforafricans.com/feed/
  - https://www.scholars4dev.com/feed/
  - https://weworkremotely.com/categories/remote-customer-support-jobs.rss
