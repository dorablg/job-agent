name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["state/**"]   # the agent's own state commits don't need CI
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. security rules)
        run: ruff check .
      - name: Tests (Python + JavaScript)
        run: python -m pytest -q
      - name: Known-vulnerability audit of dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
