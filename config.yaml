filters:
  max_age_days: 30
  max_experience_years: 2          # skip jobs asking for 3+ years (you have ~1 year)
  hide_not_open_to_tunisia: false  # London/Italy are on-site; remote jobs use require_tunisia instead
  # Languages you don't speak: postings that require them (or are written in them) are skipped
  exclude_required_languages: [Italian, German, Spanish, Dutch, Portuguese, Polish, Swedish, Danish, Norwegian,
    Japanese, Greek, Bulgarian, Romanian, Czech, Turkish, Hebrew, Russian, Finnish, Hungarian, Korean, Chinese]
  exclude_title_words: [senior, sr, staff, principal, lead, director, head, manager, vp, phd, mba, expert, ii, iii, iv,
    mid-level, mid level, experienced, us remote, us only, usa only, u.s. only, us-based, canada only]
  exclude_words: [us citizens only, security clearance, must be located in the us, must reside in the us,
    must reside in the united states, located in the united states, us work authorization, authorized to work in the us]
  allowed_locations: []            # location is decided per category now

min_score: 45                 # 0-100; raise to get fewer, better alerts
max_alerts_per_run: 10
max_ai_tailoring_per_run: 8   # new matches that get a full apply kit each run (free AI quota)
max_backfill_kits_per_run: 8  # older good matches that still have no kit
notify_when_empty: false

sources: [workable, company_boards, jobs_ac_uk, remotive, remoteok, jobicy, himalayas]

