    iv, mid-level, mid level, experienced, mts, member of technical staff, research associate, postdoc, postdoctoral,
    emirati, emiratis, saudi national, saudi nationals, qatari, kuwaiti, omani national, bahraini, nationals only,
    accounting, accountant, audit, us remote, us only, usa only, u.s. only, us-based, canada only]
  exclude_words: [us citizens only, security clearance, must be located in the us, must reside in the us,
    must reside in the united states, located in the united states, us work authorization, authorized to work in the us]
  allowed_locations: []            # location is decided per category now

min_score: 40                 # 0-100; raise to get fewer, better alerts
max_alerts_per_run: 15
max_ai_tailoring_per_run: 6   # new matches that get a full apply kit each run (free AI quota)
max_backfill_kits_per_run: 6  # older good matches that still have no kit
notify_when_empty: false

sources: [workable, company_boards, jobs_ac_uk, wp_search, adzuna, remotive, remoteok, jobicy, himalayas]

# Adzuna job search engine (needs ADZUNA_APP_ID and ADZUNA_APP_KEY; free plan ~250 searches/day).
# Each run takes the next `per_run` (country, search) pairs, so all pairs are covered every few runs.
# Countries Adzuna covers in your places: gb it de nl es be ch at pl (no Gulf countries).
adzuna:
  per_run: 28
  max_days_old: 21
  countries: [gb, it, nl, de, es, be, ch, at, pl]
  queries: [machine learning, ai engineer, data scientist, junior data analyst, graduate data analyst, ai intern,
    machine learning internship, research assistant machine learning, fraud analyst, financial crime analyst,
    kyc analyst, payments operations, technical operations, technical support engineer, application support analyst,
    implementation engineer, junior quantitative analyst, english speaking customer support, french speaking,
    graduate technology consultant, junior ai consultant, solutions engineer, business analyst fintech, product analyst,
    trust and safety analyst, technical account manager]

# Deep search of opportunity sites: FULL posts (real deadlines, funding details), last 75 days.
opportunity_search:
  days: 75
  per_query: 30
  sites: [https://opportunitydesk.org, https://opportunitiescorners.com, https://www.opportunitiesforafricans.com,
    https://opportunitiescircle.com]
  queries: [fully funded conference, travel grant, fully funded exchange, exchange program, summer school, winter school,
    summer program, hackathon, bootcamp, youth summit, leadership program, artificial intelligence, machine learning,
    data science, technology, fintech, women in tech, startup, innovation, digital, fully funded fellowship,
    fully funded scholarship, internship, virtual internship, remote, part-time, competition, training program]

