name: job-agent

on:
  schedule:
    # GitHub silently drops many scheduled runs when it is busy (we only got ~3 a day from a 3-hourly cron).
    # So it knocks every 30 minutes, and the "gate" job below lets a run through only if the last real run
    # finished ~3 hours ago: dependable runs every ~3 hours.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}      # "Run workflow" button for a manual run

permissions:
  contents: write            # save state (no duplicate alerts)
  pages: write               # publish the dashboard website
  id-token: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: state/last_run.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: check
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f state/last_run.txt ]; then
            last=$(date -d "$(cat state/last_run.txt)" +%s 2>/dev/null || echo 0)
            age=$(( ( $(date +%s) - last ) / 60 ))
            echo "last real run finished $age minutes ago"
            [ "$age" -lt 165 ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_WEBAPP_URL: ${{ secrets.GMAIL_WEBAPP_URL }}
      GMAIL_WEBAPP_KEY: ${{ secrets.GMAIL_WEBAPP_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      PYTHONUNBUFFERED: "1"      # live logs, one line at a time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Self-test (a broken change never touches your data or alerts)
        run: python -m pytest -q
      - name: Decrypt CV
        run: python -m agent.secure unlock
      - name: Run agent
        run: python -m agent.main
        timeout-minutes: 60       # leaves time to save state and publish even on a bad day
      - name: Save state
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "update job state"
          # code may have changed while this run was working: replay the state commit on top, then push
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site
      # GitHub Pages sometimes answers with a temporary server error: try up to 3 times
      - id: deploy1
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deploy
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
